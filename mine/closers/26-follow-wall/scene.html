<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#111216;overflow:hidden}#wall{position:absolute;left:-500px;top:-120px;width:2100px;height:2200px;transform:rotate(-14deg)}#group{position:absolute;left:267px;top:650px;width:546px;height:845px}canvas{width:546px;height:845px}#avatar{position:absolute;width:502px;height:502px;left:22px;top:22px;border:8px solid white;border-radius:50%;object-fit:cover;display:none}</style><div id="wall"></div><div id="group"><img id="avatar"><canvas id="follow10" width="420" height="650"></canvas></div><video id="followSrc10" muted preload="auto" style="position:absolute;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none"></video><script src="config.js"></script><script>
const cfg=window.MOTION_CONFIG,wall=document.querySelector('#wall'),v=document.querySelector('video');const frames=cfg.foreground_frames.map(src=>{let im=new Image();im.src=src;return im});const framesReady=Promise.all(frames.map(im=>im.decode()));wall.style.opacity=cfg.wall_opacity;if(cfg.avatar){let im=document.querySelector('#avatar');im.src=cfg.avatar;im.style.display='block'}for(let r=0;r<4;r++){let row=document.createElement('div');row.className='row';row.style.cssText=`position:absolute;top:${r*510}px;left:0;display:flex;gap:28px`;for(let c=0;c<8;c++){let im=document.createElement('img');im.src=cfg.wall_images[(r*4+c)%cfg.wall_images.length];im.style.cssText='width:800px;height:450px;object-fit:cover;border-radius:8px';row.appendChild(im)}wall.appendChild(row)}window.draw=f=>{let t=f/cfg.fps,q=1-Math.pow(1-Math.min(1,f/cfg.rise_frames),3);document.querySelector('#group').style.transform=`translateY(${(1-q)*1400}px)`;document.querySelectorAll('.row').forEach((r,i)=>r.style.transform=`translateX(${-950+(i%2?-1:1)*t*65+(i%2)*170}px)`)};
function paint10(f){const cv=document.getElementById('follow10'),ctx=cv.getContext('2d');ctx.clearRect(0,0,420,650);ctx.drawImage(frames[f%frames.length],0,0);if(cfg.avatar){let im=ctx.getImageData(0,0,420,650),a=im.data;for(let y=0;y<650;y++)for(let x=0;x<420;x++){if((x-210)**2+(y-210)**2<193**2&&!((x-210)**2+(y-380)**2<66**2))a[(y*420+x)*4+3]=0}ctx.putImageData(im,0,0)}}
window.seekFrame=async f=>{await framesReady;draw(f);paint10(f)};window.MOTION_READY=true;draw(0);</script>
