<script src="assets/gsap.min.js"></script><script src="config.js"></script><script>
const cfg=window.MOTION_CONFIG;const data={products:cfg.items,captions:cfg.captions,keeps:[[0,cfg.duration_frames]]};const products=data.products;const cards=document.getElementById('cards');const poster=p=>p.image;
products.forEach((p,i)=>{let el=document.createElement('div');el.className='card';el.innerHTML=`<img src="${poster(p)}"><div class="label"><b>${p.rank}</b>${p.name}</div>`;cards.appendChild(el)});
const els=[...cards.children],tl=gsap.timeline({paused:true});els.forEach((el,i)=>tl.fromTo(el,{opacity:0},{opacity:1,duration:.2},2+i*.06));window.__timelines={'tool-ranking':tl};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const ease=x=>1-Math.pow(1-clamp(x),3);let sourceFrame=103;
function sourceAt(frame){let cursor=0;for(const [a,b]of data.keeps){if(frame<cursor+b-a)return a+frame-cursor;cursor+=b-a}return 3918}
function draw(frame){frame=Math.round(frame);sourceFrame=sourceAt(frame);let caption=data.captions.find(c=>frame>=c.start_frame&&frame<c.end_frame);document.getElementById('caption').textContent=caption?.text||'';
const flash=document.getElementById('flash'),detail=document.getElementById('detail');flash.style.display=frame<cfg.timing.flash_frames?'block':'none';detail.style.display=frame>=156?'block':'none';
if(frame<cfg.timing.flash_frames){let i=Math.min(products.length-1,Math.floor(frame/(cfg.timing.flash_frames/products.length))),p=products[i],f=frame%(cfg.timing.flash_frames/products.length);document.getElementById('flashImg').src=poster(p);document.getElementById('flashImg').style.transform=`scale(${1.12-f*.018}) translateX(${(f-2)*4}px)`;document.getElementById('flashNum').textContent=p.rank;document.getElementById('flashName').textContent=f>=2?p.name:'';document.getElementById('flashCredit').textContent=p.id==='kling'?'应用示意':'来源：'+p.credit;document.getElementById('progress').style.width=(90+frame/cfg.timing.flash_frames*820)+'px'}
els.forEach((el,i)=>{const x=i>=8?25+(i-8)*520:25+(i%2)*520,y=i>=8?200:620+Math.floor(i/2)*195;const w=490,h=i>=8?390:175;const e=ease((frame-cfg.timing.flash_frames-i*cfg.timing.card_stagger_frames)/cfg.timing.card_entry_frames);const sx=i%2?-200:1100,sy=[-200,1000,350][i%3];el.style.cssText=`left:${sx+(x-sx)*e}px;top:${sy+(y-sy)*e}px;width:${w}px;height:${h}px;opacity:${frame<cfg.timing.flash_frames?0:e};transform:rotate(${(i%2?8:-9)*(1-e)}deg);display:${frame>=156?'none':'block'}`;if(frame>110&&i===0)el.style.boxShadow='0 0 0 4px #e6bf63,0 0 25px #e6bf6370'});
if(frame>=156){let p=products.find(p=>sourceFrame>=p.source_start_frame&&sourceFrame<p.source_end_frame)||products[0];document.getElementById('detailImg').src=poster(p);document.getElementById('detailTitle').textContent=`${p.rank}  ${p.name}`;document.getElementById('detailCredit').textContent=p.id==='kling'?'应用示意':'来源：'+p.credit;document.getElementById('detailImg').style.transform=`scale(${1+.025*Math.sin(frame/90)})`;document.getElementById('focus').style.opacity=clamp((frame-156)/10)}return sourceFrame}
window.draw=draw;window.seekFrame=async frame=>{draw(frame);const v=document.getElementById('person');const target=sourceFrame/30;if(Math.abs(v.currentTime-target)>.005){await new Promise(resolve=>{v.addEventListener('seeked',resolve,{once:true});v.currentTime=target})}};draw(0);


document.getElementById('person').src=cfg.presenter;document.getElementById('heading').innerHTML=cfg.heading+'<br><em>'+cfg.subheading+'</em>';
const drawOriginal=window.draw;window.draw=f=>{drawOriginal(f);document.getElementById('portrait').style.display=cfg.show_presenter?'block':'none';document.getElementById('master').style.background=cfg.colors.background;if(f>=cfg.timing.focus_start_frame){els.forEach((e,i)=>{e.style.filter=i===0?'none':'brightness(.45)';e.style.boxShadow=i===0?'0 0 0 3px '+cfg.colors.accent:'none'})}};
window.seekFrame=async f=>{window.draw(f);const v=document.getElementById('person');if(cfg.show_presenter){if(v.readyState<1)await new Promise(r=>v.addEventListener('loadedmetadata',r,{once:true}));if(Math.abs(v.currentTime-f/cfg.fps)>.005)await new Promise(r=>{v.addEventListener('seeked',r,{once:true});v.currentTime=f/cfg.fps})}};
window.draw(0);
window.MOTION_READY=true;
