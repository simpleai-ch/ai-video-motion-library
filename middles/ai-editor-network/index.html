  .ptitle{left:695px;top:75px;width:1225px;height:52px;border-bottom:1px solid #2a2a2a;background:repeating-linear-gradient(135deg,#191919 0 8px,#141414 8px 16px)}
  .ptitle span{position:absolute;left:22px;top:8px;color:#fff;font:900 30px/36px var(--cn)}
  .corner{left:690px;top:70px;width:40px;height:40px;border-left:4px solid var(--yel);border-top:4px solid var(--yel)}

  .comp{position:absolute;top:178px;height:80px;display:flex;align-items:center;gap:16px;padding:0 22px;background:#1d1d1d;border-top:1px solid #333;color:#fff;font:900 42px/1 var(--cn)}

  .lbl{font:500 18px/1 var(--cn);color:#ddd;display:flex;align-items:center;gap:10px}

  .track{height:17px;border-radius:9px;background:#262626;left:932px;width:943px}
  .bar{height:17px;border-radius:9px}

  #ctrl{position:fixed;left:0;right:0;bottom:0;height:56px;background:#161616;border-top:1px solid #2a2a2a;display:flex;align-items:center;gap:14px;padding:0 18px;color:#ccc;font:14px var(--cn)}
  #ctrl button{background:#262626;color:#eee;border:1px solid #3a3a3a;border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer}
  #ctrl button:hover{background:#333}
  #ctrl input[type=range]{flex:1;accent-color:var(--yel)}
  #t{width:64px;text-align:right;font-family:var(--mono)}
  #hero .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
  #eyeF{animation-delay:.02s}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  #hero .hand{animation:type .32s ease-in-out infinite alternate}
  #handF{animation-delay:.16s}
  @keyframes type{to{transform:translateY(-6px)}}
  #head{transform-box:fill-box;transform-origin:50% 90%;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:rotate(-2deg) translateY(2px)}}
  svg .cg{transform-box:fill-box;transform-origin:center}
</style>

<script>
/* ===== 可替换内容（改这里即可复用） ===== */
const CONFIG={
  subtitle:'那大家或许会觉得',
  windowTitle:'“AI的剪映”',
  modelTag:'大模型',
  companies:['公司','高管','网红'],
  nodeLabel:'平台',
  barLabels:['图层1','光点','行星','轨迹'],
  totalSeconds:13
};
const $=id=>document.getElementById(id);
const stage=$('stage');
$('sub').textContent=CONFIG.subtitle;$('ptxt').textContent=CONFIG.windowTitle;$('tag').textContent=CONFIG.modelTag;
CONFIG.companies.forEach((t,i)=>{const el=$('c'+i);el.lastChild.textContent=t});
function fit(){const W=innerWidth,H=innerHeight-56;const s=Math.min(W/1920,H/1080);
  stage.style.transform=`translate(${(W-1920*s)/2}px,${(H-1080*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();

/* ---------- build timeline + network DOM ---------- */
const TL=$('tl');
['0s','1s','2s','3s','4s','5s'].forEach((s,i)=>{const x=932+i*188.6;
  TL.insertAdjacentHTML('beforeend',`<div class="abs ruler rl" style="left:${x-(i==5?24:0)}px;top:612px">${s}</div>`);
  for(let k=0;k<5;k++)if(i<5)TL.insertAdjacentHTML('beforeend',`<div class="abs" style="left:${x+k*37.7}px;top:${k?632:626}px;width:1px;height:${k?8:14}px;background:#777"></div>`)});
const bars=[['#eee',932],['var(--yel)',996],['var(--blu)',1045],['var(--red)',1103]].map((b,i)=>[CONFIG.barLabels[i],...b]);
bars.forEach(([n,c,x0],i)=>{const y=670+i*29;
  TL.insertAdjacentHTML('beforeend',`<div class="abs lbl tl-l" style="left:748px;top:${y}px"><b style="background:${c}"></b>${n}</div>
  <div class="abs track tl-t" style="top:${y}px"></div>
  <div class="abs bar tl-b" style="left:${x0}px;top:${y}px;width:${1875-x0}px;background:${c}"></div>`)});

const COL={r:'#e23b2e',b:'#2f6fe0',y:'#f5c43a'};
// [letter, cx, cy, r, color]  — layout mirrors the reference
const C=[['A',1083,449,52,'r'],['B',1135,380,46,'b'],['C',1231,444,55,'y'],['D',1290,371,40,'r'],
  ['E',1404,452,63,'b'],['F',1480,371,40,'y'],['G',1537,440,58,'r'],['H',1608,376,38,'b'],
  ['I',1717,447,52,'y'],['J',1688,357,40,'r'],['K',1148,501,55,'b'],['L',1317,501,58,'y'],['M',1634,501,58,'r']];
const ANCH=[[1150,258,'r'],[1405,258,'b'],[1658,258,'y']];
const NS='http://www.w3.org/2000/svg';const net=$('net');
let defs=`<defs><mask id="mNet" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">`, lines='', circles='';
C.forEach(([L,cx,cy,r,c],i)=>{
  ANCH.forEach(([ax,ay,ac],j)=>{
    const sy=cy, d=`M${cx} ${sy} C${cx} ${sy-r-90} ${ax} ${ay+70} ${ax} ${ay}`;
    defs+=`<path class="lm" data-i="${i}" data-j="${j}" d="${d}" fill="none" stroke="#fff" stroke-width="8" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>`;
    lines+=`<path d="${d}" fill="none" stroke="${COL[ac]}" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round" opacity=".85"/>`;
  });
  const fs=Math.round(r*0.62);
  circles+=`<g class="cg circ" data-i="${i}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4 4"/>
    <g class="ctext"><text x="${cx}" y="${cy-r*0.08}" text-anchor="middle" font-family="${getComputedStyle(document.body).fontFamily}" font-weight="900" font-size="${fs}" fill="#fff">${CONFIG.nodeLabel}</text>
    <text x="${cx}" y="${cy+r*0.62}" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="${fs*1.05}" fill="${COL[c]}">${L}</text></g></g>`;
});
net.innerHTML=defs+`</mask></defs><g mask="url(#mNet)">${lines}</g>${circles}`;

/* ---------- animation timeline (seconds) ---------- */
const OUT='cubic-bezier(.22,1,.36,1)', BACK='cubic-bezier(.34,1.56,.64,1)', IO='cubic-bezier(.65,0,.35,1)';
let anims=[];
function A(el,kf,at,dur,ease=OUT){const a=el.animate(kf,{delay:at*1000,duration:dur*1000,easing:ease,fill:'both'});anims.push(a);return a}
const fadeUp=(el,at,dur=.4,dy=14)=>A(el,[{opacity:0,transform:`translateY(${dy}px)`},{opacity:1,transform:'none'}],at,dur);
const TOTAL=CONFIG.totalSeconds;

function build(){
  anims.forEach(a=>a.cancel());anims=[];
  // chrome
  fadeUp($('sub'),0.2,.5);
  // 1. character + desk slide in left → right
  A($('hero'),[{transform:'translateX(-760px)',opacity:0},{opacity:1,offset:.3},{transform:'none',opacity:1}],0.25,1.0,OUT);
  // 2. red frame unrolls top → bottom like a scroll
  A($('tag'),[{opacity:0,transform:'scaleX(0)',transformOrigin:'left'},{opacity:1,transform:'none',transformOrigin:'left'}],1.25,.3,OUT);
  A($('roller'),[{opacity:0,transform:'translateY(0)'},{opacity:1,offset:.08,transform:'translateY(0)'},{opacity:1,offset:.92,transform:'translateY(321px)'},{opacity:0,transform:'translateY(321px)'}],1.35,1.15,'linear');
  A($('model'),[{clipPath:'inset(0 0 100% 0)'},{clipPath:'inset(0 0 0% 0)'}],1.4,1.0,IO);
  // 3. AI image
  A($('robot'),[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'none'}],2.45,.5,BACK);
  // 4. yellow dots + fold line
  A($('dot1'),[{opacity:0,transform:'scale(0)'},{opacity:1,transform:'none'}],3.0,.3,BACK);
  A($('foldMask'),[{strokeDashoffset:1},{strokeDashoffset:0}],3.2,.45,IO);
  A($('dot2'),[{opacity:0,transform:'scale(0)'},{opacity:1,transform:'none'}],3.6,.3,BACK);
  // popup opens from dot2: line to the right, then expands vertically
  A($('popup'),[{clipPath:'inset(147px 100% 595px 0)'},{clipPath:'inset(147px 0% 595px 0)',offset:.45},{clipPath:'inset(0px 0% 0px 0)'}],3.8,.9,IO);
  A($('corner'),[{opacity:0,transform:'translate(20px,20px)'},{opacity:1,transform:'none'}],4.5,.35);
  A($('ptxt'),[{opacity:0,transform:'translateX(-20px)'},{opacity:1,transform:'none'}],4.6,.35);
  // 5. popup contents: tree → canvas → timeline
  [...$('tree').children].forEach((el,i)=>A(el,[{opacity:0,transform:'translateX(-24px)'},{opacity:1,transform:'none'}],4.75+i*.07,.35));
  A($('canvasRect'),[{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'none'}],5.0,.45);
  document.querySelectorAll('.rl').forEach((el,i)=>fadeUp(el,5.2+i*.04,.3,8));
  document.querySelectorAll('.tl-l').forEach((el,i)=>A(el,[{opacity:0},{opacity:1}],5.35+i*.08,.3));
  document.querySelectorAll('.tl-t').forEach((el,i)=>A(el,[{opacity:0},{opacity:1}],5.35+i*.08,.3));
  // bars fill independently at different, uneven speeds (white fastest → red slowest)
  const BARS=[[5.7,3.2],[5.85,4.3],[6.0,5.4],[6.15,6.6]];
  document.querySelectorAll('.tl-b').forEach((el,i)=>{
    const [st,dur]=BARS[i];
    const jit=[[.18,.10],[.35,.31],[.52,.42],[.7,.66],[.86,.79]].map(([o,p],k)=>({offset:o,clipPath:`inset(0 ${(100-100*Math.min(1,p+((i*7+k*3)%5-2)*.02)).toFixed(1)}% 0 0)`}));
    A(el,[{clipPath:'inset(0 100% 0 0)'},...jit,{clipPath:'inset(0 0% 0 0)'}],st,dur,'linear');
  });
  // 6a. companies fade in one by one
  [0,1,2].forEach(i=>A($('c'+i),[{opacity:0,filter:'blur(6px)'},{opacity:1,filter:'blur(0)'}],6.1+i*.4,.55,'ease-out'));
  // 6b. circles: half-appear → lines draw to companies → finish appearing
  const S0=7.5, STEP=.24, HALF=.28, LINE=.6, DONE=.35;
  document.querySelectorAll('.circ').forEach(g=>{
    const i=+g.dataset.i, s=S0+i*STEP, tot=HALF+LINE+DONE;
    A(g,[{opacity:0,transform:'scale(0)',easing:BACK},
         {opacity:.55,transform:'scale(.55)',offset:HALF/tot},
         {opacity:.55,transform:'scale(.55)',offset:(HALF+LINE)/tot,easing:BACK},
         {opacity:1,transform:'scale(1)'}],s,tot,'linear');
    A(g.querySelector('.ctext'),[{opacity:0},{opacity:0,offset:(HALF+LINE)/tot},{opacity:1}],s,tot,'linear');
  });
  document.querySelectorAll('.lm').forEach(p=>{
    const s=S0+(+p.dataset.i)*STEP+HALF+(+p.dataset.j)*.06;
    A(p,[{strokeDashoffset:1},{strokeDashoffset:0}],s,LINE-.08,IO);
  });
}

/* ---------- controls ---------- */
let playing=true,t0=performance.now();
const scrub=$('scrub'),tt=$('t'),bPlay=$('bPlay');
function seek(sec){anims.forEach(a=>{a.currentTime=sec*1000})}
function tick(){
  if(playing){let sec=(performance.now()-t0)/1000;
    if(sec>TOTAL){if($('loop').checked){t0=performance.now();sec=0;seek(0)}else{sec=TOTAL;setPlay(false)}}
    seek(sec);scrub.value=sec;tt.textContent=sec.toFixed(2)+'s'}
  requestAnimationFrame(tick)}
function setPlay(p){playing=p;bPlay.textContent=p?'⏸ 暂停':'▶ 播放';if(p)t0=performance.now()-scrub.value*1000}
build();anims.forEach(a=>a.pause());requestAnimationFrame(tick);
bPlay.onclick=()=>setPlay(!playing);
$('bReplay').onclick=()=>{scrub.value=0;setPlay(true);t0=performance.now()};
scrub.oninput=()=>{setPlay(false);seek(+scrub.value);tt.textContent=(+scrub.value).toFixed(2)+'s'};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlay(!playing)}});
</script>
</body>
</html>
